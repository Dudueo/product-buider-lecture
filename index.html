<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제휴 문의</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #dfe9f3);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
            text-align: center;
            font-size: 26px;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
            text-align: center;
            font-size: 15px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        textarea:focus {
            outline: none;
            border-color: #4f7cff;
            box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 8px;
            background: #4f7cff;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background: #315fe0;
        }

        button:active {
            transform: translateY(1px);
        }

        .footer-note {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: #888;
        }

        .comments-container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .comments-container h2 {
            font-size: 20px;
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🤝 제휴 및 협력 문의</h1>
    <p class="description">
        서비스 제휴, 비즈니스 협업 또는 기타 문의사항이 있으시면 아래 양식을 작성해 주세요.<br>
        검토 후 빠르게 연락드리겠습니다.
    </p>

    <form action="https://formspree.io/f/xwlpqayn" method="POST">
        <div class="form-group">
            <label for="company">회사명 / 단체명</label>
            <input type="text" id="company" name="company" placeholder="회사명 또는 단체명을 입력하세요">
        </div>

        <div class="form-group">
            <label for="name">담당자 성명</label>
            <input type="text" id="name" name="name" required placeholder="성함을 입력하세요">
        </div>

        <div class="form-group">
            <label for="email">이메일 주소</label>
            <input type="email" id="email" name="email" required placeholder="example@company.com">
        </div>

        <div class="form-group">
            <label for="phone">연락처 (선택)</label>
            <input type="tel" id="phone" name="phone" placeholder="010-0000-0000">
        </div>

        <div class="form-group">
            <label for="message">문의 내용</label>
            <textarea id="message" name="message" required placeholder="제휴 내용 및 상세 문의사항을 자유롭게 작성해 주세요."></textarea>
        </div>

        <button type="submit">제휴 문의 제출하기</button>
    </form>

    <div class="footer-note">
        Submitted via Formspree
    </div>
</div>

<div class="comments-container">
    <h2>💬 문의 관련 의견 및 댓글</h2>
    <div id="disqus_thread"></div>
    <script>
        /**

        };

        (d.head || d.body).appendChild(s);
        })();
    </script>
    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
</div>

</body>
</html>
